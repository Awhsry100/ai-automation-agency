services:
  turbo:
    build: .
    container_name: turbo

    # ✅ NOT public. Only nginx can reach it on the docker network.
    expose:
      - "5000"

    volumes:
      - ./data:/app/data

    env_file:
      - .env
    environment:
      PORT: "5000"
      REDIS_URL: "redis://redis:6379/0"

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/dev/ping', timeout=3).read()\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped
    stop_grace_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: turbo-nginx

    depends_on:
      turbo:
        condition: service_healthy

    # ✅ Public entry points
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: turbo-redis

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10