# /etc/nginx/conf.d/default.conf

# --- HTTP: redirect to HTTPS + support ACME challenge ---
server {
  listen 80;
  listen [::]:80;

  server_name turbodeskapp.com www.turbodeskapp.com;

  # LetsEncrypt challenge
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# --- HTTPS: main reverse proxy ---
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  server_name turbodeskapp.com www.turbodeskapp.com;

  ssl_certificate     /etc/letsencrypt/live/turbodeskapp.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/turbodeskapp.com/privkey.pem;

  # reasonable SSL defaults
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # --- Proxy all app traffic to Turbo container ---
  location / {
    proxy_pass http://turbo:5000;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout  120s;
    proxy_send_timeout  120s;
  }

  # --- Socket.IO / Websocket support (realtime) ---
  location /socket.io/ {
    proxy_pass http://turbo:5000;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout  120s;
    proxy_send_timeout  120s;
  }
}