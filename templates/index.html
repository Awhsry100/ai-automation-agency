<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Turbo Desk — Home Service AI</title>
  <link rel="stylesheet" href="/static/style.css?v={{cache_bust}}">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="logo">T</div>
        <div class="brandtext">
          <div class="title">Turbo Desk</div>
          <div class="subtitle">Home Service AI</div>
        </div>
      </div>

      <div class="clientbar">
        <input id="clientIdInput" class="input" type="text" placeholder="client id (default / abc_plumbing)" />
        <button id="applyClientBtn" class="btn">Apply</button>
      </div>
    </header>

    <main class="grid">
      <section class="card">
        <div class="cardhead">
          <div>
            <div class="cardtitle">Customer Chat</div>
            <div class="muted">Online</div>
          </div>
          <div class="pill">Online</div>
        </div>

        <div id="chatBox" class="chatbox" aria-live="polite"></div>

        <div class="typingrow">
          <span id="typingIndicator" class="typing hidden">AI is typing…</span>
        </div>

        <div class="composer">
          <input id="messageInput" class="input grow" type="text" placeholder="Describe the issue… (ex: my outlet is sparking)" />
          <button id="sendBtn" class="btn primary">Send</button>
        </div>

        <div class="hint">Press <b>Enter</b> to send</div>
      </section>

      <aside class="card">
        <div class="cardhead">
          <div>
            <div class="cardtitle">System</div>
            <div class="muted">Status: <b id="sysStatus">Checking…</b></div>
          </div>
        </div>

        <div class="syslist">
          <div class="sysrow">
            <div class="syslabel">Client</div>
            <div id="sysClient" class="sysvalue">default</div>
          </div>
          <div class="sysrow">
            <div class="syslabel">Email Alerts</div>
            <div id="emailStatus" class="sysvalue">—</div>
          </div>
          <div class="sysrow">
            <div class="syslabel">Last Priority</div>
            <div id="priorityStatus" class="sysvalue">—</div>
          </div>
        </div>

        <div class="links">
          <a href="/health" target="_blank" rel="noreferrer">Health</a>
          <a href="/clients" target="_blank" rel="noreferrer">Clients</a>
          <a href="/admin" target="_blank" rel="noreferrer">Admin</a>
          <a href="/onboard" target="_blank" rel="noreferrer">Onboard</a>
        </div>
      </aside>
    </main>
  </div>

  <script src="/static/script.js?v={{cache_bust}}"></script>
</body>
</html>
