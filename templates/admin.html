<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{ client.business_name }} — Admin Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
  <script>window.TURBO_CLIENT_ID="{{ client.client_id }}";</script>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo">TD</div>
      <div>
        <div class="title">{{ client.business_name }}</div>
        <div class="subtitle">Admin login</div>
      </div>
    </div>
    <div class="top-actions">
      <a class="btn btn-ghost" href="{{ url_for('client_chat', client_id=client.client_id) }}">Back</a>
    </div>
  </div>

  <div class="shell">
    <div class="panel" style="max-width:520px;margin:0 auto;">
      <div class="panel-head">
        <div>
          <div class="panel-title">Admin login</div>
          <div class="panel-subtitle">Sign in to open the dispatcher for this client.</div>
        </div>
        <span class="pill pill-muted">/c/{{ client.client_id }}</span>
      </div>

      <div class="kv">
        {% if error %}
          <div class="empty-state empty-state-error">
            <div class="empty-title">Login failed</div>
            <div class="empty-desc">{{ error }}</div>
          </div>
        {% endif %}

        <form method="post" action="{{ url_for('admin_login_post', client_id=client.client_id) }}">
          <div style="display:flex;flex-direction:column;gap:10px;">
            <input class="input" name="username" placeholder="Username" autocomplete="username" />
            <input class="input" name="password" type="password" placeholder="Password" autocomplete="current-password" />
            <button class="btn btn-primary" type="submit">Sign in →</button>
          </div>
        </form>

        <div class="muted" style="margin-top:10px;">
          Tip: set env var <span class="mono">ADMIN_USERS</span> to <span class="mono">admin:YourPass</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
