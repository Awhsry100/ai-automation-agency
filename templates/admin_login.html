<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{ client.business_name or client.client_id }} — Admin login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo">TD</div>
      <div>
        <div class="title">{{ client.business_name or client.client_id }}</div>
        <div class="subtitle">Admin login</div>
      </div>
    </div>
    <div class="top-actions">
      <a class="btn btn-ghost" href="{{ url_for('client_chat', client_id=client.client_id) }}">← Back</a>
    </div>
  </div>

  <div style="max-width:560px;margin:18px auto;padding:0 14px 22px;">
    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">Sign in</div>
          <div class="panel-subtitle">Dispatcher access</div>
        </div>
      </div>

      <div style="padding:14px;">
        {% if error %}
          <div class="bubble alert" style="margin-bottom:12px;">
            <div class="bubble-title">Login failed</div>
            <div class="bubble-text">{{ error }}</div>
          </div>
        {% endif %}

        <form method="post" action="{{ url_for('admin_login', client_id=client.client_id) }}">
          <input type="hidden" name="next" value="{{ next }}">

          <div style="display:grid;gap:10px;">
            <input class="input" name="username" placeholder="Username" autocomplete="username" required>
            <input class="input" name="password" placeholder="Password" type="password" autocomplete="current-password" required>
            <button class="btn btn-primary" type="submit">Login</button>
          </div>

          <div class="muted" style="margin-top:10px;font-size:12px;">
            Tip: set env <span class="mono">ADMIN_USERS</span> like:
            <span class="mono">admin:StrongPass123,manager:Turbo!Dispatch#9fK2@2026</span>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
